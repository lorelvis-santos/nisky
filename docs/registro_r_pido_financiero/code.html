                            Gasto
                        </button>

</div>
</div>
<!-- Secondary Fields Stack -->
<div class="flex flex-col gap-element-gap-md">
<!-- Account Dropdown -->
<div class="flex flex-col gap-element-gap-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="cuenta">Cuenta</label>

<option value="principal">Cuenta Principal</option>
<option value="efectivo">Efectivo</option>
<option value="ahorros">Ahorros</option>
</select>
<span class="material-symbols-outlined absolute right-2 top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant">expand_more</span>

<script>
        // Micro-interaction for Segmented Control
        document.addEventListener('DOMContentLoaded', () => {
            const btnIngreso = document.getElementById('btn-ingreso');
            const btnGasto = document.getElementById('btn-gasto');
            const categoriaSelect = document.getElementById('categoria');
            const montoInput = document.getElementById('monto');

            // Set today's date by default
            document.getElementById('fecha').valueAsDate = new Date();

            const categoriasIngreso = [
                { value: 'ventas', text: 'Ventas' },
                { value: 'servicios', text: 'Servicios' },
                { value: 'honorarios', text: 'Honorarios' },
                { value: 'otros', text: 'Otros Ingresos' }
            ];

            const categoriasGasto = [
                { value: 'operacion', text: 'Gastos de Operación' },
                { value: 'nomina', text: 'Nómina' },
                { value: 'impuestos', text: 'Impuestos' },
                { value: 'suministros', text: 'Suministros' }
            ];

            function updateCategorias(options) {
                categoriaSelect.innerHTML = '';
                options.forEach(opt => {
                    const el = document.createElement('option');
                    el.value = opt.value;
                    el.textContent = opt.text;
                    categoriaSelect.appendChild(el);
                });
            }

            function setActiveButton(activeBtn, inactiveBtn, type) {
                activeBtn.classList.remove('text-on-surface-variant', 'border-transparent', 'hover:bg-surface-container');
                activeBtn.classList.add('bg-surface', 'text-primary', 'border-outline-variant');
                
                inactiveBtn.classList.add('text-on-surface-variant', 'border-transparent', 'hover:bg-surface-container');
                inactiveBtn.classList.remove('bg-surface', 'text-primary', 'border-outline-variant');

                if(type === 'ingreso') {
                    updateCategorias(categoriasIngreso);
                    montoInput.classList.remove('text-error');
                    montoInput.classList.add('text-primary');
                } else {
                    updateCategorias(categoriasGasto);
                    montoInput.classList.remove('text-primary');
                    montoInput.classList.add('text-error');
                }
            }

            btnIngreso.addEventListener('click', () => setActiveButton(btnIngreso, btnGasto, 'ingreso'));
            btnGasto.addEventListener('click', () => setActiveButton(btnGasto, btnIngreso, 'gasto'));
        });
    </script>
