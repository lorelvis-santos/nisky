<style>

            font-size: 8rem;
            line-height: 1;

        }

<body class="bg-surface text-on-surface h-screen w-screen flex items-center justify-center overflow-hidden font-body-md">
<!-- Intent: Task-Focused. Nav shell is completely suppressed as per semantic shell mandate (zero distractions mode) -->
<main class="w-full max-w-2xl px-8 flex flex-col items-center">
<!-- Context Card -->
<div class="w-full bg-surface-container-lowest border border-outline-variant p-6 mb-12 flex flex-col items-center text-center rounded">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest mb-2">Enfoque Actual</span>
<h1 class="font-headline-sm text-headline-sm text-primary mb-4">Refactorizar lógica de autenticación</h1>
<div class="flex items-center gap-2">
<span class="inline-flex items-center justify-center bg-secondary-container text-on-secondary-container px-3 py-1 font-data-mono text-data-mono rounded">
                    Ciclo 2 de 4
                </span>
</div>
</div>
<!-- Timer -->
<div class="mb-16">
<div class="font-data-mono text-primary timer-text font-medium select-none" id="pomodoro-timer">
                24:59
            </div>
</div>
<!-- Controls -->
<div class="flex items-center gap-element-gap-md w-full max-w-md">
<button class="flex-1 bg-surface-container-lowest border border-outline-variant text-on-surface-variant font-body-md text-body-md py-4 px-6 rounded hover:bg-surface-container-high hover:border-outline transition-colors duration-100 flex items-center justify-center gap-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">pause</span>
                Pausar
            </button>
<button class="flex-1 bg-surface-container-lowest border border-outline-variant text-on-surface-variant font-body-md text-body-md py-4 px-6 rounded hover:bg-surface-container-high hover:border-outline transition-colors duration-100 flex items-center justify-center gap-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">stop</span>
                Detener
            </button>
</div>
<div class="mt-4 w-full max-w-md">
<button class="w-full bg-primary-container text-on-primary font-headline-xs text-headline-xs py-4 px-6 rounded hover:bg-primary transition-colors duration-100 flex items-center justify-center gap-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
                Marcar como Completada
            </button>
</div>
</main>
<!-- Exit Focus Mode -->
<button class="absolute top-6 left-6 text-on-surface-variant hover:text-primary transition-colors duration-100 flex items-center gap-2 font-body-sm text-body-sm bg-surface-container-lowest border border-outline-variant px-3 py-2 rounded">
<span class="material-symbols-outlined text-[18px]">arrow_back</span>
        Salir del modo
    </button>
<script>
        // Simple visual timer logic for demonstration
        const timerElement = document.getElementById('pomodoro-timer');
        let seconds = 24 * 60 + 59;
        
        setInterval(() => {
            if (seconds > 0) {
                seconds--;
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                timerElement.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            }
        }, 1000);
    </script>
</body></html>
